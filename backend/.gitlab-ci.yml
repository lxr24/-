image: registry.spring26b.secoder.net/tool/deployer

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - export BUILD_IMAGE_NAME=$CI_REGISTRY_IMAGE
    - export BUILD_IMAGE_TAG=$CI_COMMIT_REF_SLUG
    - export BUILD_IMAGE_USERNAME=$CI_REGISTRY_USER
    - export BUILD_IMAGE_PASSWORD=$CI_REGISTRY_PASSWORD
    - deployer build

.test:
  image: python:3.11
  stage: test

  before_script:
    - pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt
      coverage pytest pycodestyle pylint

unit-test:
  extends: .test
  variables:
    TESTING: 1      # 关键：告诉代码使用 SQLite
    # 不再需要任何 MySQL 相关的变量
  script:
    # 不再需要安装 mariadb-client、等待 MySQL 启动等
    - pip install aiosqlite   # 确保安装 SQLite 异步驱动
    - coverage run --source app -m pytest --junit-xml=xunit-reports/xunit-result.xml
    - ret=$?
    - coverage combine
    - coverage xml -o coverage-reports/coverage.xml
    - coverage report
    - exit $ret
  # after_script 保持原样（SonarScanner 配置不变）
  after_script:
    - SUFFIX=$RANDOM
    - curl "http://api.spring26b.secoder.net/static/sonar-scanner.tar.gz" -s -o "/tmp/sonar-$SUFFIX.tar.gz"
    - tar -xf "/tmp/sonar-$SUFFIX.tar.gz"  -C /opt
    - /opt/sonar-scanner/bin/sonar-scanner 
      -Dsonar.host.url=https://sonarqube.spring26b.secoder.net/
      -Dsonar.login=$SONAR_TOKEN
  artifacts:
    paths:
      - coverage-reports/coverage.xml
      - xunit-reports/xunit-result.xml

style-test:
  extends: .test
  allow_failure: true

  script:
    - pycodestyle app
    - PYCODESTYLE_RET=$?
    - pylint app
    - PYLINT_RET=$?
    - if [ $PYCODESTYLE_RET \> 0 ]; then exit $PYCODESTYLE_RET; fi;
    - exit $PYLINT_RET

deploy:
  stage: deploy
  script:
    - export API_SERVER=https://deployer.spring26b.secoder.net/api
    - deployer dyno replace $CI_PROJECT_NAME "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" "$REGISTRY_USER" "$REGISTRY_PWD"
  only:
    - master